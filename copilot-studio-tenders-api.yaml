swagger: "2.0"
info:
  title: Subsidiemarkt Tenders API
  description: >
    Read-only view op de subsidie-/financial-control-geclassificeerde
    opdrachten (tabel `tenders` in Supabase). Bedoeld om als REST API tool /
    custom connector in Microsoft Copilot Studio te importeren. Vervang
    "JOUW-PROJECT-REF" hieronder door je eigen Supabase project-ref
    (Dashboard -> Settings -> API -> Project URL).
  version: "1.0.0"
host: JOUW-PROJECT-REF.supabase.co
basePath: /rest/v1
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json

# Supabase vereist ALTIJD twee dingen samen: de apikey (projectidentificatie)
# en een Authorization-header met "Bearer <key>". In Copilot Studio/Power
# Platform vul je bij "Authorization" letterlijk "Bearer <jouw-anon-key>" in
# (inclusief het woord Bearer -- apiKey-auth voegt dat zelf niet toe).
# De apikey staat hier als query-parameter, niet als header: Power Platform
# strip't auth-headers soms tijdens credential-validatie, query-parameters
# komen altijd door.
securityDefinitions:
  ApiKeyQuery:
    type: apiKey
    in: query
    name: apikey
  BearerHeader:
    type: apiKey
    in: header
    name: Authorization
security:
  - ApiKeyQuery: []
    BearerHeader: []

paths:
  /tenders:
    get:
      summary: Zoek subsidie-/financial-control-opdrachten
      description: >
        Geeft opdrachten terug uit alle gescrapete bronnen (Mercell,
        TenderNed, Opdracht Overheid, ...), inclusief de subsidie-relevantie-
        classificatie. Gebruik subsidie_relevant=eq.true om alleen relevante
        opdrachten te zien.
      operationId: ZoekTenders
      parameters:
        - name: select
          in: query
          type: string
          default: "bron,tender_id,nummer,titel,organisatie,bron_status,url,locatie,deadline,publicatiedatum,eerst_gezien,subsidie_relevant,subsidie_categorieen,subsidie_trefwoorden,subsidie_score"
          description: Komma-gescheiden kolomlijst (PostgREST select-syntax).
        - name: subsidie_relevant
          in: query
          type: string
          description: 'PostgREST-filter, bv. "eq.true" om alleen relevante opdrachten te zien.'
        - name: subsidie_categorieen
          in: query
          type: string
          description: 'PostgREST-filter op categorie, bv. "ilike.*Subsidies*" of "ilike.*Compliance*".'
        - name: bron
          in: query
          type: string
          description: 'PostgREST-filter op platform, bv. "eq.mercell".'
        - name: organisatie
          in: query
          type: string
          description: 'PostgREST-filter, bv. "ilike.*gemeente*".'
        - name: titel
          in: query
          type: string
          description: 'PostgREST-filter, bv. "ilike.*controller*".'
        - name: locatie
          in: query
          type: string
          description: 'PostgREST-filter, bv. "ilike.*utrecht*".'
        - name: order
          in: query
          type: string
          default: "subsidie_score.desc"
          description: 'Sorteerveld(en), bv. "publicatiedatum.desc" of "deadline.asc".'
        - name: limit
          in: query
          type: integer
          default: 20
          description: Maximum aantal resultaten.
        - name: offset
          in: query
          type: integer
          default: 0
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Tender"

  /beschrijvingen:
    get:
      summary: Haal de volledige omschrijving van één opdracht op
      description: >
        Gebruik nadat /tenders een opdracht heeft opgeleverd, met bron en
        tender_id van die rij, voor de volledige (langere) omschrijvingstekst.
      operationId: HaalOmschrijvingOp
      parameters:
        - name: bron
          in: query
          type: string
          required: true
          description: 'PostgREST-filter, bv. "eq.mercell".'
        - name: tender_id
          in: query
          type: string
          required: true
          description: 'PostgREST-filter, bv. "eq.12345".'
        - name: select
          in: query
          type: string
          default: "bron,tender_id,omschrijving"
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Beschrijving"

definitions:
  Tender:
    type: object
    properties:
      bron:
        type: string
        description: Platform waar de opdracht vandaan komt (bv. mercell, tenderned, opdrachtoverheid).
      tender_id:
        type: string
      nummer:
        type: string
      titel:
        type: string
      organisatie:
        type: string
      bron_status:
        type: string
        description: Status zoals het bronplatform 'm aanlevert (bv. Open).
      url:
        type: string
      locatie:
        type: string
      deadline:
        type: string
      publicatiedatum:
        type: string
      eerst_gezien:
        type: string
        format: date-time
      subsidie_relevant:
        type: boolean
      subsidie_categorieen:
        type: string
        description: 'Komma-gescheiden matchende categorieën, bv. "Subsidies, Reporting".'
      subsidie_trefwoorden:
        type: string
      subsidie_score:
        type: integer
  Beschrijving:
    type: object
    properties:
      bron:
        type: string
      tender_id:
        type: string
      omschrijving:
        type: string
